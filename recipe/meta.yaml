{% set name = "jgo" %}
{% set version = "3.3.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 16d13ec7ee186463f9c2604a0c86749f8f837d3b44810195b43a796f6a25ac2d

build:
  number: 0
  noarch: python
  entry_points:
    - jgo = jgo.__main__:main

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=77.0.0
  run:
    - python >={{ python_min }}
    - cjdk >=0.4.0
    - psutil >=7
    - requests >=2.30.0
    - rich >=14.3.0
    - rich-click >=1.9.5
    - semver >=3.0.0
    - tomli-w >=1.0.0

test:
  requires:
    - python {{ python_min }}
    - pip
  imports:
    - jgo
  commands:
    - pip check
    - jgo --help
    - test "${JGO_CACHE_DIR}" = "${CONDA_PREFIX}/jgo"
    - test -f "${CONDA_PREFIX}/etc/conda/activate.d/jgo_activate.bat"
    - test -f "${CONDA_PREFIX}/etc/conda/deactivate.d/jgo_deactivate.bat"

about:
  home: https://github.com/apposed/jgo
  license: Unlicense
  license_family: PUBLIC-DOMAIN
  summary: Launch Java code from Python and the CLI, installation-free.
  doc_url: https://jgo.apposed.org/
  dev_url: https://github.com/apposed/jgo

extra:
  recipe-maintainers:
    - ctrueden
    - elevans
    - hinerm
